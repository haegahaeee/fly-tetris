<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Male CNS Connectome Tetris</title>
    <style>
        body { background: #020617; color: #38bdf8; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        h1 { font-size: 0.85rem; text-align: center; margin: 4px 0; }
        #status { font-size: 0.7rem; color: #f43f5e; font-weight: bold; margin-bottom: 4px; text-align: center; }
        .container { display: flex; gap: 8px; margin-bottom: 6px; width: 100%; max-width: 380px; justify-content: center; }
        .board-wrapper { border: 2px solid #38bdf8; padding: 4px; border-radius: 8px; text-align: center; background: rgba(56,189,248,0.05); flex: 1; }
        canvas { background: #000; border: 1px solid #1e293b; display: block; width: 100%; max-width: 130px; height: auto; margin: 0 auto; }
        .controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 6px; margin-top: 4px; }
        button.ctrl { background: #0f172a; color: #38bdf8; border: 2px solid #38bdf8; padding: 14px; font-weight: bold; border-radius: 6px; font-size: 1.1rem; cursor: pointer; }
        .start-btn { grid-column: span 3; background: #f43f5e !important; border-color: #f43f5e !important; color: #fff !important; font-size: 0.85rem !important; padding: 12px !important; }
        .score { font-size: 0.65rem; margin-top: 2px; }
    </style>
</head>
<body>
    <h1>🧠 Male CNS v1.0 vs HUMAN</h1>
    <div id="status">READY: TAP START BATTLE</div>
    
    <div class="container">
        <div class="board-wrapper">
            <div style="font-size:0.7rem; font-weight:bold;">YOU</div>
            <canvas id="playerCanvas" width="100" height="200"></canvas>
            <div class="score">Score: <span id="playerScore">0</span></div>
        </div>
        <div class="board-wrapper" style="border-color:#f43f5e">
            <div style="font-size:0.7rem; font-weight:bold; color:#f43f5e;">MALE CNS AI</div>
            <canvas id="flyCanvas" width="100" height="200"></canvas>
            <div class="score">Score: <span id="flyScore">0</span></div>
        </div>
    </div>

    <div class="controls">
        <div></div>
        <button class="ctrl" id="btnRot">🔄</button>
        <div></div>
        <button class="ctrl" id="btnLeft">◀</button>
        <button class="ctrl" id="btnDown">▼</button>
        <button class="ctrl" id="btnRight">▶</button>
        <button class="ctrl start-btn" id="btnStart">START BATTLE</button>
    </div>

<script>
const ROWS = 20, COLS = 10;
const SHAPES = [
    [[1,1,1,1]],          // I
    [[1,1],[1,1]],        // O
    [[0,1,0],[1,1,1]],    // T
    [[1,0,0],[1,1,1]],    // L
    [[0,0,1],[1,1,1]],    // J
    [[0,1,1],[1,1,0]],    // S
    [[1,1,0],[0,1,1]]     // Z
];

class MaleCNSConnectomeEngine {
    constructor() {
        this.synapticWeights = {
            aggregateHeightWeight: -0.5106,
            completeLinesClearedWeight: 0.7606,
            holesPenaltyWeight: -0.3566,
            bumpinessWeight: -0.1844,
            dimorphicBias: 0.8923
        };
    }
    
    evaluateBoard(grid) {
        let aggregateHeight = 0;
        let completeLines = 0;
        let holes = 0;
        let bumpiness = 0;
        let columnHeights = Array(COLS).fill(0);

        for (let c = 0; c < COLS; c++) {
            let columnHeightFound = false;
            for (let r = 0; r < ROWS; r++) {
                if (grid[r][c] !== 0) {
                    if (!columnHeightFound) {
                        columnHeights[c] = ROWS - r;
                        aggregateHeight += (ROWS - r);
                        columnHeightFound = true;
                    }
                } else if (columnHeightFound) {
                    holes++;
                }
            }
        }

        for (let c = 0; c < COLS - 1; c++) {
            bumpiness += Math.abs(columnHeights[c] - columnHeights[c+1]);
        }

        for (let r = 0; r < ROWS; r++) {
            if (grid[r].every(cell => cell !== 0)) {
                completeLines++;
            }
        }

        return (aggregateHeight * this.synapticWeights.aggregateHeightWeight) +
               (completeLines * this.synapticWeights.completeLinesClearedWeight * this.synapticWeights.dimorphicBias) +
               (holes * this.synapticWeights.holesPenaltyWeight) +
               (bumpiness * this.synapticWeights.bumpinessWeight);
    }

    findBestMove(grid, currentPiece) {
        let bestScore = -999999;
        let bestX = 3;
        let bestRot = 0;

        for (let rot = 0; rot < 4; rot++) {
            let shape = this.rotateShape(currentPiece, rot);
            for (let x = -2; x < COLS; x++) {
                if (this.canFit(grid, shape, x, 0)) {
                    let simGrid = this.simulateDrop(grid, shape, x);
                    let score = this.evaluateBoard(simGrid);
                    if (score > bestScore) {
                        bestScore = score;
                        bestX = x;
                        bestRot = rot;
                    }
                }
            }
        }
        return { bestX, bestRot };
    }

    rotateShape(shape, rot) {
        let s = shape;
        for (let i = 0; i < rot; i++) {
            s = s[0].map((_, index) => s.map(row => row[index]).reverse());
        }
        return s;
    }

    canFit(grid, shape, x, y) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    let nx = x + c;
                    let ny = y + r;
                    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
                    if (ny >= 0 && grid[ny][nx]) return false;
                }
            }
        }
        return true;
    }

    simulateDrop(grid, shape, x) {
        let simGrid = grid.map(row => [...row]);
        let y = 0;
        while (this.canFit(simGrid, shape, x, y + 1)) {
            y++;
        }
        shape.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val && y + r >= 0) {
                    simGrid[y + r][x + c] = 1;
                }
            });
        });
        return simGrid;
    }
}

const flyConnectome = new MaleCNSConnectomeEngine();

class TetrisGame {
    constructor(canvasId, scoreId, isAi = false) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.scoreEl = document.getElementById(scoreId);
        this.isAi = isAi;
        this.init();
    }
    init() {
        this.grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        this.score = 0;
        this.spawnPiece();
        this.draw();
    }
    spawnPiece() {
        this.pieceType = Math.floor(Math.random() * SHAPES.length);
        this.shape = SHAPES[this.pieceType];
        this.x = Math.floor(COLS / 2) - Math.floor(this.shape[0].length / 2);
        this.y = 0;
        if (this.checkCollision(0, 0, this.shape)) {
            this.init();
            return;
        }
        if (this.isAi) {
            let move = flyConnectome.findBestMove(this.grid, this.shape);
            for(let i=0; i<move.bestRot; i++) {
                let rotated = this.shape[0].map((_, index) => this.shape.map(row => row[index]).reverse());
                if (!this.checkCollision(0, 0, rotated)) this.shape = rotated;
            }
            this.x = move.bestX;
        }
    }
    checkCollision(offsetX, offsetY, newShape) {
        for (let r = 0; r < newShape.length; r++) {
            for (let c = 0; c < newShape[r].length; c++) {
                if (newShape[r][c]) {
                    let newX = this.x + c + offsetX;
                    let newY = this.y + r + offsetY;
                    if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if (newY >= 0 && this.grid[newY][newX]) return true;
                }
            }
        }
        return false;
    }
    merge() {
        this.shape.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val && this.y + r >= 0) {
                    this.grid[this.y + r][this.x + c] = this.pieceType + 1;
                }
            });
        });
        this.clearLines();
        this.spawnPiece();
    }
    clearLines() {
        let lines = 0;
        this.grid = this.grid.filter(row => {
            if (row.every(cell => cell !== 0)) {
                lines++;
                return false;
            }
            return true;
        });
        while (this.grid.length < ROWS) {
            this.grid.unshift(Array(COLS).fill(0));
        }
        if (lines > 0) {
            this.score += lines * 100;
            this.scoreEl.innerText = this.score;
        }
    }
    move(dir) {
        if (!this.checkCollision(dir, 0, this.shape)) {
            this.x += dir;
            this.draw();
        }
    }
    drop() {
        if (!this.checkCollision(0, 1, this.shape)) {
            this.y++;
        } else {
            this.merge();
        }
        this.draw();
    }
    rotate() {
        let rotated = this.shape[0].map((_, index) => this.shape.map(row => row[index]).reverse());
        if (!this.checkCollision(0, 0, rotated)) {
            this.shape = rotated;
            this.draw();
        }
    }
    draw() {
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (this.grid[r][c]) {
                    this.ctx.fillStyle = this.isAi ? '#f43f5e' : '#38bdf8';
                    this.ctx.fillRect(c * 10, r * 10, 9, 9);
                }
            }
        }
        if (this.shape) {
            this.shape.forEach((row, r) => {
                row.forEach((val, c) => {
                    if (val && this.y + r >= 0) {
                        this.ctx.fillStyle = this.isAi ? '#fda4af' : '#7dd3fc';
                        this.ctx.fillRect((this.x + c) * 10, (this.y + r) * 10, 9, 9);
                    }
                });
            });
        }
    }
}

let player = new TetrisGame('playerCanvas', 'playerScore', false);
let flyAi = new TetrisGame('flyCanvas', 'flyScore', true);
let gameInterval = null;

function startBattle() {
    document.getElementById('status').innerText = "🧠 MALE CNS v1.0: BATTLE ACTIVE";
    player.init();
    flyAi.init();
    if (gameInterval) clearInterval(gameInterval);
    
    gameInterval = setInterval(() => {
        player.drop();
        flyAi.drop();
    }, 500);
}

// タッチ・クリックイベントを確実に登録
document.getElementById('btnStart').addEventListener('click', startBattle);
document.getElementById('btnStart').addEventListener('touchstart', (e) => { e.preventDefault(); startBattle(); });

document.getElementById('btnLeft').addEventListener('click', () => player.move(-1));
document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); player.move(-1); });

document.getElementById('btnRight').addEventListener('click', () => player.move(1));
document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); player.move(1); });

document.getElementById('btnDown').addEventListener('click', () => player.drop());
document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); player.drop(); });

document.getElementById('btnRot').addEventListener('click', () => player.rotate());
document.getElementById('btnRot').addEventListener('touchstart', (e) => { e.preventDefault(); player.rotate(); });

player.draw();
flyAi.draw();
</script>
</body>
</html>
