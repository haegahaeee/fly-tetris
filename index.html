<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Male CNS Connectome Tetris</title>
    <style>
        body { background: #020617; color: #38bdf8; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; touch-action: manipulation; }
        h1 { font-size: 0.9rem; text-align: center; margin: 5px 0; }
        #status { font-size: 0.75rem; color: #f43f5e; font-weight: bold; margin-bottom: 5px; }
        .container { display: flex; gap: 10px; margin-bottom: 8px; width: 100%; max-width: 380px; justify-content: center; }
        .board-wrapper { border: 2px solid #38bdf8; padding: 4px; border-radius: 8px; text-align: center; background: rgba(56,189,248,0.05); flex: 1; }
        canvas { background: #000; border: 1px solid #1e293b; display: block; width: 100%; max-width: 130px; height: auto; margin: 0 auto; }
        .controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 6px; margin-top: 5px; }
        button.ctrl { background: #0f172a; color: #38bdf8; border: 2px solid #38bdf8; padding: 10px; font-weight: bold; border-radius: 6px; font-size: 1.1rem; }
        .start-btn { grid-column: span 3; background: #f43f5e !important; border-color: #f43f5e !important; color: #fff !important; font-size: 0.9rem !important; }
        .score { font-size: 0.7rem; margin-top: 3px; }
    </style>
</head>
<body>
    <h1>🧠 Male CNS vs HUMAN</h1>
    <div id="status">STATUS: READY</div>
    
    <div class="container">
        <div class="board-wrapper">
            <div style="font-size:0.75rem; font-weight:bold;">YOU</div>
            <canvas id="playerCanvas" width="100" height="200"></canvas>
            <div class="score">Score: <span id="playerScore">0</span></div>
        </div>
        <div class="board-wrapper" style="border-color:#f43f5e">
            <div style="font-size:0.75rem; font-weight:bold; color:#f43f5e;">MALE CNS AI</div>
            <canvas id="flyCanvas" width="100" height="200"></canvas>
            <div class="score">Score: <span id="flyScore">0</span></div>
        </div>
    </div>

    <div class="controls">
        <div></div>
        <button class="ctrl" onclick="playerRotate()">🔄</button>
        <div></div>
        <button class="ctrl" onclick="playerLeft()">◀</button>
        <button class="ctrl" onclick="playerDown()">▼</button>
        <button class="ctrl" onclick="playerRight()">▶</button>
        <button class="ctrl start-btn" onclick="startBattle()">START BATTLE</button>
    </div>

<script>

    [[1,1,1,1]], // I
    [[1,1],[1,1]], // O
    [[0,1,0],[1,1,1]], // T
    [[1,0,0],[1,1,1]], // L
    [[0,0,1],[1,1,1]]  // J
];

class TetrisGame {
    constructor(canvasId, scoreId, isAi = false) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.scoreEl = document.getElementById(scoreId);
        this.isAi = isAi;
        this.init();
    }
    init() {
        this.grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        this.score = 0;
        this.spawnPiece();
    }
    spawnPiece() {
        this.pieceType = Math.floor(Math.random() * SHAPES.length);
        this.shape = SHAPES[this.pieceType];
        this.x = Math.floor(COLS / 2) - Math.floor(this.shape[0].length / 2);
        this.y = 0;
        if (this.checkCollision(0, 0, this.shape)) {
            this.init(); // Game Over Reset
        }
    }
    checkCollision(offsetX, offsetY, newShape) {
        for (let r = 0; r < newShape.length; r++) {
            for (let c = 0; c < newShape[r].length; c++) {
                if (newShape[r][c]) {
                    let newX = this.x + c + offsetX;
                    let newY = this.y + r + offsetY;
                    if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if (newY >= 0 && this.grid[newY][newX]) return true;
                }
            }
        }
        return false;
    }
    merge() {
        this.shape.forEach((row, r) => {
            row.forEach((val, c) => {
                if (val && this.y + r >= 0) {
                    this.grid[this.y + r][this.x + c] = this.pieceType + 1;
                }
            });
        });
        this.clearLines();
        this.spawnPiece();
    }
    clearLines() {
        let lines = 0;
        this.grid = this.grid.filter(row => {
            if (row.every(cell => cell !== 0)) {
                lines++;
                return false;
            }
            return true;
        });
        while (this.grid.length < ROWS) {
            this.grid.unshift(Array(COLS).fill(0));
        }
        if (lines > 0) {
            this.score += lines * 100;
            this.scoreEl.innerText = this.score;
        }
    }

            this.x += dir;
            this.draw();
        }
